<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="https://cibgh.org/wp-content/uploads/2024/01/cibg-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>CIB Ghana Events Platform | Chartered Institute of Bankers, Ghana</title>
    <meta name="description" content="Discover, attend, and register for world-class conferences, training workshops, and executive summits by the Chartered Institute of Bankers, Ghana (CIB Ghana)." />
    <meta name="keywords" content="CIB Ghana, Chartered Institute of Bankers Ghana, Banking Conference, Ghana Banking Events, Ethics in Banking, Financial Training, Banking Week" />
    <meta name="theme-color" content="#0A5C36" />
    
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CIB Ghana Events" />
    <meta property="og:title" content="CIB Ghana Events Platform | Chartered Institute of Bankers, Ghana" />
    <meta property="og:description" content="Where Ghana's banking and financial professionals connect, learn, and shape the future of the industry." />
    <meta property="og:image" content="https://cibgh.org/wp-content/uploads/2024/01/cibg-logo.png" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CIB Ghana Events Platform | Chartered Institute of Bankers, Ghana" />
    <meta name="twitter:description" content="Where Ghana's banking and financial professionals connect, learn, and shape the future of the industry." />

    <!-- Preload critical venue background images for instant display -->
    <link rel="preload" as="image" href="/aqua-safari-register-banner.jpg" fetchpriority="high" />
    <link rel="preload" as="image" href="/aqua-safari-ticket-bg.jpg" />

    <!-- Google Fonts: Plus Jakarta Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-white text-cib-charcoal-900 font-sans antialiased selection:bg-cib-green-100 selection:text-cib-green-900">
    <script>
      (function() {
        if ('scrollRestoration' in history) {
          history.scrollRestoration = 'manual';
        }
        window.addEventListener('beforeunload', function() {
          if ('scrollRestoration' in history) {
            history.scrollRestoration = 'manual';
          }
        });
        // Reset zoom to 100% natural scale
        if (document.body) {
          document.body.style.zoom = '1';
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

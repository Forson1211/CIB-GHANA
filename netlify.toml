# Netlify Configuration for CIB Ghana
[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

# SPA Fallback: Direct all routes to index.html with HTTP 200 so React Router can handle them
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
